<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 2rem;
			background: #f4f7f8;
			color: #20333b;
			font-family: Arial, sans-serif;
		}

		svg {
			display: block;
			width: min(100%, 800px);
			height: auto;
			border: 3px solid #315b68;
			background: #bfe8f4;
		}

		#scene-annotated-figure {
			margin-top: 2rem;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
		}

		#scene-annotated #annotations text,
		#scene-annotated #annotations line {
			pointer-events: none;
		}

		#scene-annotated #annotations text {
			stroke: none;
		}

		#scene-adjusted-figure {
			margin-top: 2rem;
		}

		#scene-adjusted .adjusted-house-body {
			fill: #f8d58a;
			stroke: #4d3020;
			stroke-width: 6;
		}

		#scene-adjusted .adjusted-roof {
			fill: #a93f3f;
			stroke: #4d3020;
			stroke-width: 7;
		}

		#scene-adjusted .adjusted-fence {
			stroke: #5c3825;
			stroke-width: 6;
			stroke-dasharray: 14 8;
		}

		#scene-adjusted .adjusted-footpath {
			fill: #b8b0a0;
			stroke: #756d60;
			stroke-width: 4;
		}

		#scene-adjusted .adjusted-mailbox {
			fill: #315b68;
			stroke: #20333b;
			stroke-width: 3;
		}

		#scene-adjusted .adjusted-smoke {
			fill: #dce5e7;
			stroke: #9aaeb3;
			stroke-width: 2;
		}
	</style>
</head>
<body>
	<figure id="scene-original">
	<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
		<title id="scene-title">A house and garden scene</title>
		<desc id="scene-desc">A sunny garden with a cloud, tree, fenced yard, house, curved garden path, and caption.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="500" fill="#bfe8f4"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#8bcf78"></rect>

		<!-- Sun and cloud -->
		<circle cx="690" cy="90" r="48" fill="#ffd45c" stroke="#e6a82f" stroke-width="4"></circle>
		<ellipse cx="155" cy="105" rx="70" ry="28" fill="#ffffff"></ellipse>
		<circle cx="115" cy="100" r="30" fill="#ffffff"></circle>
		<circle cx="175" cy="88" r="38" fill="#ffffff"></circle>

		<!-- Tree -->
		<rect x="95" y="238" width="34" height="125" fill="#8a5738"></rect>
		<circle cx="112" cy="205" r="62" fill="#4d9e55"></circle>
		<circle cx="65" cy="235" r="45" fill="#5eae5b"></circle>
		<circle cx="158" cy="235" r="45" fill="#3f8e4b"></circle>

		<!-- House -->
		<rect x="275" y="225" width="285" height="175" fill="#f1c27d" stroke="#70462d" stroke-width="5"></rect>
		<polygon points="245,230 415,90 590,230" fill="#c85c4b" stroke="#70462d" stroke-width="5"></polygon>
		<rect x="495" y="137" width="34" height="86" fill="#9b5b46" stroke="#70462d" stroke-width="4"></rect>

		<!-- Door and windows -->
		<rect x="385" y="298" width="68" height="102" fill="#6c4935" stroke="#493123" stroke-width="4"></rect>
		<circle cx="438" cy="350" r="5" fill="#f7d36a"></circle>
		<rect x="305" y="265" width="55" height="52" fill="#9bd9e8" stroke="#493123" stroke-width="4"></rect>
		<line x1="332.5" y1="265" x2="332.5" y2="317" stroke="#493123" stroke-width="4"></line>
		<line x1="305" y1="291" x2="360" y2="291" stroke="#493123" stroke-width="4"></line>
		<rect x="480" y="265" width="55" height="52" fill="#9bd9e8" stroke="#493123" stroke-width="4"></rect>
		<line x1="507.5" y1="265" x2="507.5" y2="317" stroke="#493123" stroke-width="4"></line>
		<line x1="480" y1="291" x2="535" y2="291" stroke="#493123" stroke-width="4"></line>

		<!-- Fence -->
		<polyline points="25,355 25,310 65,310 65,355 105,355 105,310 145,310 145,355 185,355 185,310 225,310 225,355" fill="none" stroke="#8a5738" stroke-width="8"></polyline>
		<line x1="15" y1="328" x2="235" y2="328" stroke="#8a5738" stroke-width="7"></line>

		<!-- Curved path -->
		<path d="M 420 400 C 430 425, 520 435, 600 500 L 360 500 C 400 455, 420 425, 420 400 Z" fill="#d8bd91" stroke="#aa895e" stroke-width="3"></path>

		<!-- Garden details and caption -->
		<polygon points="650,390 662,420 695,420 668,439 678,470 650,451 622,470 632,439 605,420 638,420" fill="#e85d75"></polygon>
		<text x="400" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#315b42">Welcome to our garden</text>
	</svg>
		<figcaption>Original scene</figcaption>
	</figure>

	<figure id="scene-annotated-figure">
	<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="annotated-scene-title annotated-scene-desc">
		<title id="annotated-scene-title">An annotated house and garden scene</title>
		<desc id="annotated-scene-desc">The original house and garden scene with labels identifying SVG shape attributes.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="500" fill="#bfe8f4"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#8bcf78"></rect>

		<!-- Sun and cloud -->
		<circle cx="690" cy="90" r="48" fill="#ffd45c" stroke="#e6a82f" stroke-width="4"></circle>
		<ellipse cx="155" cy="105" rx="70" ry="28" fill="#ffffff"></ellipse>
		<circle cx="115" cy="100" r="30" fill="#ffffff"></circle>
		<circle cx="175" cy="88" r="38" fill="#ffffff"></circle>

		<!-- Tree -->
		<rect x="95" y="238" width="34" height="125" fill="#8a5738"></rect>
		<circle cx="112" cy="205" r="62" fill="#4d9e55"></circle>
		<circle cx="65" cy="235" r="45" fill="#5eae5b"></circle>
		<circle cx="158" cy="235" r="45" fill="#3f8e4b"></circle>

		<!-- House -->
		<rect x="275" y="225" width="285" height="175" fill="#f1c27d" stroke="#70462d" stroke-width="5"></rect>
		<polygon points="245,230 415,90 590,230" fill="#c85c4b" stroke="#70462d" stroke-width="5"></polygon>
		<rect x="495" y="137" width="34" height="86" fill="#9b5b46" stroke="#70462d" stroke-width="4"></rect>

		<!-- Door and windows -->
		<rect x="385" y="298" width="68" height="102" fill="#6c4935" stroke="#493123" stroke-width="4"></rect>
		<circle cx="438" cy="350" r="5" fill="#f7d36a"></circle>
		<rect x="305" y="265" width="55" height="52" fill="#9bd9e8" stroke="#493123" stroke-width="4"></rect>
		<line x1="332.5" y1="265" x2="332.5" y2="317" stroke="#493123" stroke-width="4"></line>
		<line x1="305" y1="291" x2="360" y2="291" stroke="#493123" stroke-width="4"></line>
		<rect x="480" y="265" width="55" height="52" fill="#9bd9e8" stroke="#493123" stroke-width="4"></rect>
		<line x1="507.5" y1="265" x2="507.5" y2="317" stroke="#493123" stroke-width="4"></line>
		<line x1="480" y1="291" x2="535" y2="291" stroke="#493123" stroke-width="4"></line>

		<!-- Fence -->
		<polyline points="25,355 25,310 65,310 65,355 105,355 105,310 145,310 145,355 185,355 185,310 225,310 225,355" fill="none" stroke="#8a5738" stroke-width="8"></polyline>
		<line x1="15" y1="328" x2="235" y2="328" stroke="#8a5738" stroke-width="7"></line>

		<!-- Curved path -->
		<path d="M 420 400 C 430 425, 520 435, 600 500 L 360 500 C 400 455, 420 425, 420 400 Z" fill="#d8bd91" stroke="#aa895e" stroke-width="3"></path>

		<!-- Garden details and caption -->
		<polygon points="650,390 662,420 695,420 668,439 678,470 650,451 622,470 632,439 605,420 638,420" fill="#e85d75"></polygon>
		<text x="400" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#315b42">Welcome to our garden</text>

		<g id="annotations">
			<line x1="690" y1="90" x2="620" y2="45"></line>
			<text x="505" y="40">circle (cx=690, cy=90, r=48)</text>

			<line x1="275" y1="225" x2="245" y2="185"></line>
			<text x="20" y="180">rect (x=275, y=225, width=285, height=175)</text>

			<line x1="155" y1="105" x2="155" y2="60"></line>
			<text x="80" y="52">ellipse (cx=155, cy=105, rx=70, ry=28)</text>

			<line x1="332.5" y1="265" x2="270" y2="255"></line>
			<text x="20" y="250">line (x1=332.5, y1=265) -&gt; (x2=332.5, y2=317)</text>

			<line x1="25" y1="355" x2="25" y2="410"></line>
			<text x="20" y="430">polyline (25,355 ... 225,355)</text>

			<line x1="245" y1="230" x2="215" y2="270"></line>
			<text x="20" y="285">polygon (245,230 415,90 590,230)</text>

			<line x1="420" y1="400" x2="560" y2="390"></line>
			<text x="565" y="385">path (M 420 400 C 430 425 ... L 360 500)</text>

			<line x1="400" y1="475" x2="500" y2="465"></line>
			<text x="505" y="465">text (x=400, y=475)</text>
		</g>
	</svg>
		<figcaption>Annotated scene (Step 2)</figcaption>
	</figure>

	<figure id="scene-adjusted-figure">
	<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="adjusted-scene-title adjusted-scene-desc">
		<title id="adjusted-scene-title">An adjusted house and garden scene</title>
		<desc id="adjusted-scene-desc">A higher-contrast house and garden scene with a repositioned tree and house, dashed fence, footpath, mailbox, and chimney smoke.</desc>

		<!-- Contrast adjustment: deepen the ground and sky colors. -->
		<rect x="0" y="0" width="800" height="500" fill="#a9ddeb"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#72b965"></rect>

		<!-- Keep the sun and cloud shapes, with slightly varied outlines. -->
		<circle cx="690" cy="90" r="48" fill="#ffd45c" stroke="#b87916" stroke-width="5"></circle>
		<ellipse cx="155" cy="105" rx="70" ry="28" fill="#ffffff" stroke="#9bbcc4" stroke-width="2"></ellipse>
		<circle cx="115" cy="100" r="30" fill="#ffffff" stroke="#9bbcc4" stroke-width="2"></circle>
		<circle cx="175" cy="88" r="38" fill="#ffffff" stroke="#9bbcc4" stroke-width="2"></circle>

		<!-- Balance adjustment: move the tree slightly right and down. -->
		<g id="adjusted-tree" transform="translate(18, 6)">
			<rect x="95" y="238" width="34" height="125" fill="#714329" stroke="#4d3020" stroke-width="4"></rect>
			<circle cx="112" cy="205" r="62" fill="#347d42" stroke="#245c30" stroke-width="3"></circle>
			<circle cx="65" cy="235" r="45" fill="#4b9649" stroke="#347238" stroke-width="3"></circle>
			<circle cx="158" cy="235" r="45" fill="#2f713c" stroke="#245c30" stroke-width="3"></circle>
		</g>

		<!-- Balance adjustment: move the house slightly left. -->
		<g id="adjusted-house" transform="translate(-10, 0)">
			<rect class="adjusted-house-body" x="275" y="225" width="285" height="175"></rect>
			<polygon class="adjusted-roof" points="245,230 415,90 590,230"></polygon>
			<rect x="495" y="137" width="34" height="86" fill="#854832" stroke="#4d3020" stroke-width="5"></rect>

			<!-- Vary the house detail strokes for clearer separation. -->
			<rect x="385" y="298" width="68" height="102" fill="#573722" stroke="#2f2119" stroke-width="5"></rect>
			<circle cx="438" cy="350" r="5" fill="#ffe27a"></circle>
			<rect x="305" y="265" width="55" height="52" fill="#b6e8f0" stroke="#2f4e58" stroke-width="5"></rect>
			<line x1="332.5" y1="265" x2="332.5" y2="317" stroke="#2f4e58" stroke-width="3"></line>
			<line x1="305" y1="291" x2="360" y2="291" stroke="#2f4e58" stroke-width="3"></line>
			<rect x="480" y="265" width="55" height="52" fill="#b6e8f0" stroke="#2f4e58" stroke-width="5"></rect>
			<line x1="507.5" y1="265" x2="507.5" y2="317" stroke="#2f4e58" stroke-width="3"></line>
			<line x1="480" y1="291" x2="535" y2="291" stroke="#2f4e58" stroke-width="3"></line>
		</g>

		<!-- Fence adjustment: use a dashed rail and varied post width. -->
		<polyline class="adjusted-fence" points="25,355 25,310 65,310 65,355 105,355 105,310 145,310 145,355 185,355 185,310 225,310 225,355" fill="none"></polyline>
		<line class="adjusted-fence" x1="15" y1="328" x2="235" y2="328"></line>

		<!-- Preserve the original curved garden path in the third copy. -->
		<path d="M 420 400 C 430 425, 520 435, 600 500 L 360 500 C 400 455, 420 425, 420 400 Z" fill="#d8bd91" stroke="#aa895e" stroke-width="3"></path>

		<!-- Added feature: a curved stone footpath leading to the door. -->
		<path class="adjusted-footpath" d="M 419 400 C 401 428, 390 464, 382 500 L 486 500 C 465 458, 445 425, 419 400 Z"></path>
		<path d="M 419 410 C 412 430, 407 452, 403 475" fill="none" stroke="#e6dfd1" stroke-width="5" stroke-dasharray="18 10"></path>

		<!-- Added feature: a small mailbox beside the path. -->
		<g id="mailbox" transform="translate(535, 350)">
			<rect class="adjusted-mailbox" x="0" y="0" width="38" height="25"></rect>
			<polygon class="adjusted-mailbox" points="0,0 19,-12 38,0"></polygon>
			<line x1="19" y1="25" x2="19" y2="58" stroke="#4d3020" stroke-width="5"></line>
		</g>

		<!-- Added feature: a subtle puff of smoke above the chimney. -->
		<ellipse class="adjusted-smoke" cx="512" cy="112" rx="18" ry="10"></ellipse>
		<ellipse class="adjusted-smoke" cx="530" cy="88" rx="15" ry="9"></ellipse>
		<ellipse class="adjusted-smoke" cx="518" cy="66" rx="11" ry="7"></ellipse>

		<!-- Preserve the original garden detail and caption. -->
		<polygon points="650,390 662,420 695,420 668,439 678,470 650,451 622,470 632,439 605,420 638,420" fill="#d83f5f" stroke="#8f2038" stroke-width="3"></polygon>
		<text x="400" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#234b2d">Welcome to our garden</text>
	</svg>
		<figcaption>Adjusted scene (Step 3)</figcaption>
	</figure>
</body>
</html>
